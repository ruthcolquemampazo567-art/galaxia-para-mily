
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Para el amor de mi vida❤️</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
}

canvas { display: block; }

.player {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 600px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border: 2px solid #ff66aa;
  border-radius: 999px;
  background: rgba(15,0,20,.7);
  box-shadow: 0 0 15px #ff66aa, 0 0 30px #ff3399;
  z-index: 1000;
  font-family: Arial, sans-serif;
  color: white;
}

.player button {
  background: transparent;
  border: none;
  color: white;
  font-size: 22px;
  cursor: pointer;
}

.progress {
  flex-grow: 1;
  height: 14px;
  background: rgba(255,255,255,.15);
  border-radius: 999px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  touch-action: pan-y;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(270deg,#ff66aa,#ff33cc,#ff99cc,#ff66aa);
  background-size: 400% 400%;
  border-radius: 999px;
  box-shadow: 0 0 10px #ff66aa;
  animation: flowing 6s ease infinite;
}

@keyframes flowing {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.time {
  min-width: 74px;
  text-align: right;
  font-size: 12px;
  color: white;
}

@media(max-width:400px) {
  .player { width: 94%; gap: 7px; padding: 8px; }
  .time { min-width: 66px; font-size: 11px; }
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div class="player">
  <button id="play">▶️</button>
  <div class="progress" id="progress">
    <div class="progress-bar" id="progress-bar"></div>
  </div>
  <div class="time" id="time">0:00 / 0:00</div>
</div>

<audio id="audio" loop preload="metadata">
  <source src="./music/love-grows.m4a" type="audio/mp4">
</audio>

<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js"></script>

<script>
"use strict";

// =====================================
// REPRODUCTOR
// =====================================

const audio = document.getElementById("audio");
const playBtn = document.getElementById("play");
const progress = document.getElementById("progress");
const progressBar = document.getElementById("progress-bar");
const timeDisplay = document.getElementById("time");

function formatTime(sec) {
  if (!isFinite(sec)) return "0:00";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2,"0");
  return m + ":" + s;
}

playBtn.addEventListener("click", async () => {
  try {
    if (audio.paused) await audio.play();
    else audio.pause();
  } catch (error) {
    console.error(error);
    alert("No se pudo reproducir. Revisa el archivo love-grows.m4a.");
  }
});

audio.addEventListener("play", () => {
  playBtn.textContent = "⏸️";
});

audio.addEventListener("pause", () => {
  playBtn.textContent = "▶️";
});

audio.addEventListener("timeupdate", () => {
  const percent = audio.duration
    ? audio.currentTime / audio.duration * 100
    : 0;

  progressBar.style.width = percent + "%";
  timeDisplay.textContent =
    formatTime(audio.currentTime) + " / " +
    formatTime(audio.duration);
});

audio.addEventListener("loadedmetadata", () => {
  timeDisplay.textContent = "0:00 / " + formatTime(audio.duration);
});

progress.addEventListener("click", (e) => {
  if (!isFinite(audio.duration) || audio.duration <= 0) return;

  const rect = progress.getBoundingClientRect();
  const percent = Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
  audio.currentTime = percent * audio.duration;
});

audio.addEventListener("error", () => {
  console.error("Error de audio:",audio.error);
});

// =====================================
// ESCENA THREE.JS
// =====================================

if (typeof THREE === "undefined") {
  alert("No se pudo cargar Three.js. Comprueba tu conexión a internet.");
  throw new Error("Three.js no disponible");
}

const canvas = document.getElementById("c");

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1,2));
renderer.setSize(window.innerWidth,window.innerHeight);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  0.1,
  5000
);

let targetDist = 300;
let currentDist = 300;
let rotX = 0.2;
let rotY = 0;

window.addEventListener("resize",() => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

// =====================================
// FONDO
// =====================================

scene.background = new THREE.Color(0x080018);

// =====================================
// ESTRELLAS
// =====================================

(function makeStars(count=2000,spread=3000) {
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);

  for(let i=0;i<count;i++) {
    const r = spread*(0.3+Math.random()*0.7);
    const th = Math.random()*Math.PI*2;
    const ph = Math.acos(2*Math.random()-1);

    pos[i*3] = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1] = r*Math.cos(ph);
    pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
  }

  g.setAttribute("position",new THREE.BufferAttribute(pos,3));

  scene.add(new THREE.Points(
    g,
    new THREE.PointsMaterial({
      size:1.5,
      color:0xffffff,
      depthWrite:false
    })
  ));
})();

// =====================================
// LUCES
// =====================================

scene.add(new THREE.AmbientLight(0xffffff,1.2));

const light = new THREE.PointLight(0xff66aa,3,500);
light.position.set(0,0,100);
scene.add(light);

// =====================================
// NÚCLEO
// =====================================

const coreMat = new THREE.MeshPhongMaterial({
  color:0x111111,
  transparent:true,
  opacity:0.6,
  shininess:200
});

const core = new THREE.Mesh(
  new THREE.SphereGeometry(40,64,64),
  coreMat
);

scene.add(core);

// =====================================
// TEXTO CENTRAL
// =====================================

function makeCenterTextTexture(msg) {
  const c = document.createElement("canvas");
  c.width = 512;
  c.height = 512;

  const ctx = c.getContext("2d");
  ctx.clearRect(0,0,c.width,c.height);
  ctx.font = "bold 80px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#ff0033";
  ctx.shadowColor = "#ff66aa";
  ctx.shadowBlur = 50;
  ctx.fillText(msg,c.width/2,c.height/2);

  return new THREE.CanvasTexture(c);
}

const centerTex = makeCenterTextTexture("TE AMO ❤️");

const centerSprite = new THREE.Sprite(
  new THREE.SpriteMaterial({
    map:centerTex,
    transparent:true,
    depthTest:false
  })
);

centerSprite.scale.set(60,60,1);
centerSprite.position.set(0,0,0);
centerSprite.renderOrder = 999;
scene.add(centerSprite);

// =====================================
// GLOW EXTERIOR
// =====================================

function makeGlow(size=768,c1="255,160,0",c2="255,60,0") {
  const c = document.createElement("canvas");
  c.width = c.height = size;

  const g = c.getContext("2d");
  const grad = g.createRadialGradient(
    size/2,size/2,size*0.05,
    size/2,size/2,size*0.5
  );

  grad.addColorStop(0,"rgba("+c1+",0.9)");
  grad.addColorStop(0.5,"rgba("+c2+",0.5)");
  grad.addColorStop(1,"rgba(0,0,0,0)");

  g.fillStyle = grad;
  g.fillRect(0,0,size,size);

  return new THREE.CanvasTexture(c);
}

const glow = new THREE.Sprite(
  new THREE.SpriteMaterial({
    map:makeGlow(),
    transparent:true,
    depthWrite:false
  })
);

glow.scale.set(500,500,1);
scene.add(glow);

// =====================================
// ANILLOS
// =====================================

function ringTexture(size=768) {
  const c = document.createElement("canvas");
  c.width = c.height = size;

  const g = c.getContext("2d");
  g.translate(size/2,size/2);

  const r1 = size*0.34;
  const r2 = size*0.49;

  const grd = g.createRadialGradient(
    0,0,r1*0.3,
    0,0,r2
  );

  grd.addColorStop(0,"rgba(255,255,200,1)");
  grd.addColorStop(0.3,"rgba(255,160,60,0.9)");
  grd.addColorStop(0.65,"rgba(255,80,0,0.6)");
  grd.addColorStop(1,"rgba(0,0,0,0)");

  g.fillStyle = grd;
  g.beginPath();
  g.arc(0,0,r2,0,Math.PI*2);
  g.arc(0,0,r1,0,Math.PI*2,true);
  g.closePath();
  g.fill();

  return new THREE.CanvasTexture(c);
}

const ring1 = new THREE.Mesh(
  new THREE.RingGeometry(60,80,128),
  new THREE.MeshBasicMaterial({
    map:ringTexture(),
    transparent:true,
    side:THREE.DoubleSide
  })
);

const ring2 = new THREE.Mesh(
  new THREE.RingGeometry(85,100,128),
  new THREE.MeshBasicMaterial({
    map:ringTexture(),
    transparent:true,
    side:THREE.DoubleSide,
    opacity:0.6
  })
);

ring1.rotation.x = ring2.rotation.x = Math.PI/2;
scene.add(ring1,ring2);

// =====================================
// PALABRAS ALREDEDOR
// =====================================

const WORDS = [];

const baseWords = [
  "💖 Mi amor","🌞 Mi sol","🌎 Mi mundo","✨ Brillas",
  "❤️ Te amo","🌌 Universo","👑 Reina","🌠 Estrella",
  "💫 Mi cielo","🔥 Siempre tú","🎶 Tu risa","🦋 Libertad",
  "💎 Eres todo","🙏 Gracias","💕 Cariño","🌹 Amor eterno",
  "🤗 Abrazos","🌸 Esperanza","🌈 Alegría","🌟 Contigo",
  "🧸 Ternura","🎁 Mi razón","🌙 Mi destino","💌 Recuerdos",
  "🕊️ Mi paz","🪐 Mi universo","🌊 Mi calma","💡 Mi luz",
  "🍒 Dulzura","🥰 Mi vida","🎇 Felicidad","🌻 Alegría",
  "🌺 Mi flor","💜 Eternidad","🌟 Sueños","✨ Magia",
  "🎵 Canción","🔥 Pasión","⭐ Mi estrella","🌴 Mi paraíso",
  "🌄 Amanecer","🌃 Noche contigo","🎉 Mi fiesta",
  "💫 Inspiración","🌷 Siempre juntos","🎀 Mi ternura",
  "🍀 Mi fortuna","🪞 Mi reflejo","Mi Mily🌸","Mi nena", "Mi mujer"
];

for(let i=0;i<6;i++) {
  WORDS.push(...baseWords);
}

function makeTextTexture(text,color) {
  const c = document.createElement("canvas");
  c.width = 512;
  c.height = 128;

  const ctx = c.getContext("2d");
  ctx.clearRect(0,0,c.width,c.height);
  ctx.font = "bold 60px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#fff";
  ctx.shadowColor = color;
  ctx.shadowBlur = 30;
  ctx.fillText(text,c.width/2,c.height/2);

  return new THREE.CanvasTexture(c);
}

const COLORS = [
  "#ff66ff","#66ccff","#ffd36b","#ff9966",
  "#8df59a","#ffa0f8","#c6a7ff","#ff4444",
  "#44ff99","#99ccff"
];

const textGroup = new THREE.Group();
scene.add(textGroup);

for(let i=0;i<WORDS.length;i++) {
  const tex = makeTextTexture(WORDS[i],COLORS[i%COLORS.length]);

  const sp = new THREE.Sprite(
    new THREE.SpriteMaterial({
      map:tex,
      transparent:true
    })
  );

  sp.scale.set(50,16,1);

  const phi = Math.acos(2*Math.random()-1);
  const theta = Math.random()*Math.PI*2;
  const r = 150+Math.random()*120;

  sp.position.set(
    r*Math.sin(phi)*Math.cos(theta),
    r*Math.cos(phi),
    r*Math.sin(phi)*Math.sin(theta)
  );

  sp.userData = {
    phi,
    theta,
    radius:r,
    speed:0.001+Math.random()*0.001
  };

  textGroup.add(sp);
}

// =====================================
// CONTROLES DE CÁMARA
// =====================================

let dragging = false;
let lastX = 0;
let lastY = 0;

function onDown(e) {
  if(e.target.closest && e.target.closest(".player")) return;

  dragging = true;

  const t = e.touches ? e.touches[0] : e;
  lastX = t.clientX;
  lastY = t.clientY;
}

function onMove(e) {
  if(!dragging) return;
  if(e.touches && e.touches.length !== 1) return;

  const t = e.touches ? e.touches[0] : e;

  const dx = (t.clientX-lastX)/window.innerWidth;
  const dy = (t.clientY-lastY)/window.innerHeight;

  rotY -= dx*3;
  rotX = Math.max(-1.2,Math.min(1.2,rotX-dy*2.2));

  lastX = t.clientX;
  lastY = t.clientY;
}

function onUp() {
  dragging = false;
}

addEventListener("mousedown",onDown);
addEventListener("mousemove",onMove);
addEventListener("mouseup",onUp);

addEventListener("touchstart",onDown,{passive:true});
addEventListener("touchmove",onMove,{passive:true});
addEventListener("touchend",onUp,{passive:true});

addEventListener("wheel",(e) => {
  targetDist += e.deltaY*0.25;
  targetDist = Math.max(160,Math.min(600,targetDist));
},{passive:true});

// =====================================
// ZOOM CON PINZA
// =====================================

let pinch = 0;

addEventListener("touchmove",(e) => {
  if(e.touches && e.touches.length===2) {
    e.preventDefault();

    const dx = e.touches[0].clientX-e.touches[1].clientX;
    const dy = e.touches[0].clientY-e.touches[1].clientY;
    const d = Math.hypot(dx,dy);

    if(pinch) {
      targetDist += (pinch-d)*0.5;
      targetDist = Math.max(160,Math.min(600,targetDist));
    }

    pinch = d;
  }
},{passive:false});

addEventListener("touchend",() => {
  pinch = 0;
},{passive:true});

// =====================================
// ANIMACIÓN
// =====================================

let t = 0;

function tick() {
  requestAnimationFrame(tick);
  t += 0.01;

  ring1.rotation.z += 0.002;
  ring2.rotation.z -= 0.0015;

  const glowSize = 500*(1+Math.sin(t*0.4)*0.03);
  glow.scale.set(glowSize,glowSize,1);

  const s = 1+0.05*Math.sin(t*3);
  core.scale.set(s,s,s);

  textGroup.children.forEach(sp => {
    sp.material.opacity = 0.8+0.2*Math.sin(t*2);

    sp.userData.theta += sp.userData.speed;

    sp.position.x =
      sp.userData.radius*
      Math.sin(sp.userData.phi)*
      Math.cos(sp.userData.theta);

    sp.position.z =
      sp.userData.radius*
      Math.sin(sp.userData.phi)*
      Math.sin(sp.userData.theta);
  });

  currentDist += (targetDist-currentDist)*0.06;

  const cx = Math.cos(rotX);
  const sx = Math.sin(rotX);
  const cy = Math.cos(rotY);
  const sy = Math.sin(rotY);

  camera.position.set(
    currentDist*sy*cx,
    currentDist*sx,
    currentDist*cy*cx
  );

  camera.lookAt(0,0,0);

  renderer.render(scene,camera);
}

tick();

</script>
</body>
</html>
